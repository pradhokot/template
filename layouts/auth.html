<!DOCTYPE html>
<html lang="id">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title data-yield="title" data-title-suffix="app-name">Nama Aplikasi</title>
   <link rel="shortcut icon" href="@/assets/images/icon-indraco.ico" type="image/x-icon">
   <link rel="stylesheet" href="@/assets/vendor/bootstrap-5.3.8-dist/css/bootstrap.min.css">
   <link rel="stylesheet" href="@/assets/vendor/bootstrap-icons-1.13.1/bootstrap-icons.min.css">
   <link rel="stylesheet" href="@/assets/fonts/myFont.css">
   <link rel="stylesheet" href="@/assets/css/auth.css">
   <template data-stack="styles"></template>
</head>

<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
   <header class="py-3">
      <div class="container d-flex align-items-center justify-content-between">
         <a href="@/pages/home.html" class="text-decoration-none d-inline-flex align-items-center"
            aria-label="Kembali ke beranda INDRACO">
            <img src="@/assets/images/logo-indraco-dark.png"
               data-img-theme-light="@/assets/images/logo-indraco-dark.png"
               data-img-theme-dark="@/assets/images/logo-indraco-light.png"
               alt="Logo INDRACO" class="h-auto" style="max-width: 140px;">
         </a>
         <template data-include="components/theme-switcher.html"></template>
      </div>
   </header>

   <main id="main-content" class="flex-grow-1 d-flex align-items-center justify-content-center px-3 py-4" tabindex="-1">
      <div class="auth-card">
         <template data-yield="content"></template>
      </div>
   </main>

   <footer class="py-3 text-center text-body-secondary small">
      <div class="container">
         &copy; <span data-config="app-year">2026</span> <span data-config="app-name">Nama Aplikasi</span>
      </div>
   </footer>

   <script src="@/assets/vendor/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
   <script src="@/assets/js/theme-switcher.js"></script>
   <template data-stack="scripts"></template>
</body>

</html>
