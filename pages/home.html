<!DOCTYPE html>
<html lang="id">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <script src="../assets/js/template-engine.js"></script>
</head>

<body hidden>
   <template data-extends="layouts/app.html"></template>
   <template data-section="title">Beranda — Nama Aplikasi</template>

   <template data-section="content">
      <section class="py-5 border-bottom bg-body-tertiary">
         <div class="container">
            <div class="col-lg-8">
               <h1 class="fw-semibold mb-3">Starter Template Preview UI/UX</h1>
               <p class="lead text-body-secondary mb-4">
                  Kerangka HTML statis berbasis Bootstrap 5.3 dengan struktur modular bergaya Laravel Blade,
                  siap digunakan ulang untuk preview tampilan sebelum konversi ke framework.
               </p>
               <div class="d-flex flex-wrap gap-2">
                  <a href="@/admin/dashboard.html" class="btn btn-primary">
                     <i class="bi bi-speedometer2 me-1" aria-hidden="true"></i>
                     Lihat Layout Admin
                  </a>
                  <a href="@/auth/login.html" class="btn btn-outline-secondary">
                     <i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i>
                     Lihat Layout Auth
                  </a>
               </div>
            </div>
         </div>
      </section>

      <section class="py-5">
         <div class="container">
            <h2 class="h5 fw-semibold mb-3">Referensi Direktif Mini-Blade</h2>
            <div class="table-responsive">
               <table class="table table-bordered align-middle mb-0">
                  <thead>
                     <tr>
                        <th scope="col">Direktif HTML</th>
                        <th scope="col">Padanan Laravel Blade</th>
                        <th scope="col">Fungsi</th>
                     </tr>
                  </thead>
                  <tbody>
                     <tr>
                        <td><code>data-extends="layouts/app.html"</code></td>
                        <td><code>@extends('layouts.app')</code></td>
                        <td>Mewarisi file layout dari root proyek.</td>
                     </tr>
                     <tr>
                        <td><code>data-section="content"</code></td>
                        <td><code>@section('content')</code></td>
                        <td>Mendefinisikan blok konten untuk slot layout.</td>
                     </tr>
                     <tr>
                        <td><code>data-yield="content"</code></td>
                        <td><code>@yield('content')</code></td>
                        <td>Menampilkan isi section pada posisi yang ditentukan di layout.</td>
                     </tr>
                     <tr>
                        <td><code>data-include="components/theme-switcher.html"</code></td>
                        <td><code>@include('components.theme-switcher')</code></td>
                        <td>Menyisipkan partial atau komponen (mendukung include bersarang).</td>
                     </tr>
                     <tr>
                        <td><code>data-push="styles"</code> / <code>data-push="scripts"</code></td>
                        <td><code>@push('styles')</code> / <code>@push('scripts')</code></td>
                        <td>Menambahkan CSS atau JS spesifik halaman ke dalam stack layout.</td>
                     </tr>
                     <tr>
                        <td><code>data-stack="styles"</code> / <code>data-stack="scripts"</code></td>
                        <td><code>@stack('styles')</code> / <code>@stack('scripts')</code></td>
                        <td>Menentukan titik keluaran untuk seluruh item hasil push.</td>
                     </tr>
                     <tr>
                        <td><code>href="@/admin/dashboard.html"</code></td>
                        <td><code>url()</code> / <code>asset()</code></td>
                        <td>Resolusi path otomatis dari root proyek, aman di kedalaman subfolder mana pun.</td>
                     </tr>
                  </tbody>
               </table>
            </div>
         </div>
      </section>
   </template>
</body>

</html>
