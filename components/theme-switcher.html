<div class="dropdown" data-theme-switcher>
   <button
      class="btn btn-outline-secondary btn-sm dropdown-toggle d-inline-flex align-items-center gap-1"
      type="button"
      data-bs-toggle="dropdown"
      aria-expanded="false"
      aria-label="Ubah tema tampilan"
   >
      <i class="bi bi-circle-half" data-theme-icon aria-hidden="true"></i>
      <span class="d-none d-sm-inline">Tema</span>
   </button>
   <ul class="dropdown-menu dropdown-menu-end shadow-sm">
      <li>
         <button
            type="button"
            class="dropdown-item d-flex align-items-center justify-content-between gap-2"
            data-theme-value="light"
            aria-pressed="false"
         >
            <span class="d-inline-flex align-items-center gap-2">
               <i class="bi bi-sun-fill" aria-hidden="true"></i>
               Terang
            </span>
            <i class="bi bi-check2 d-none" data-theme-check aria-hidden="true"></i>
         </button>
      </li>
      <li>
         <button
            type="button"
            class="dropdown-item d-flex align-items-center justify-content-between gap-2"
            data-theme-value="dark"
            aria-pressed="false"
         >
            <span class="d-inline-flex align-items-center gap-2">
               <i class="bi bi-moon-stars-fill" aria-hidden="true"></i>
               Gelap
            </span>
            <i class="bi bi-check2 d-none" data-theme-check aria-hidden="true"></i>
         </button>
      </li>
      <li>
         <button
            type="button"
            class="dropdown-item d-flex align-items-center justify-content-between gap-2"
            data-theme-value="auto"
            aria-pressed="false"
         >
            <span class="d-inline-flex align-items-center gap-2">
               <i class="bi bi-circle-half" aria-hidden="true"></i>
               Otomatis
            </span>
            <i class="bi bi-check2 d-none" data-theme-check aria-hidden="true"></i>
         </button>
      </li>
   </ul>
</div>
